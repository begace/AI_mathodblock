[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methodblock-registry"
version = "1.0.0"
description = "A lightweight procedural memory registry for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "MethodBlock Registry contributors"}
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "typer>=0.9",
  "rich>=13.0"
]

[project.scripts]
methodblock = "methodblock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
